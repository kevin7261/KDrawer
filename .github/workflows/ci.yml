# 本 workflow：驗證 PR／push 能成功 build（讀取 repo 內 .env.production 的 VITE_GOOGLE_CLIENT_ID）。
#
# 線上網址：https://kevin7261.github.io/KDrawer/
# 發佈：請用「Deploy GitHub Pages」workflow（Settings → Pages → Source：GitHub Actions），
# 或改為只從 branch main 的 /docs 資料夾發佈（兩者擇一，勿同時啟用）。
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
