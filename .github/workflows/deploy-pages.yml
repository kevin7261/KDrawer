# 常態布署：本機執行 `npm run deploy`（build + commit/push `docs/`）。
# GitHub Pages：Settings → Source = branch main、folder「/docs」（勿與本 workflow 並用同一網址）。
# 若要改回「只推 main 就自動上版」，可再打開下方 `push` 觸發。
name: Deploy GitHub Pages (manual backup)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
