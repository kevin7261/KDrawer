# 推上 main 即自動 build 並發布到 GitHub Pages（正確的 production 靜態檔）。
#
# 首次設定（只做一次）：
# Repo → Settings → Pages → Build and deployment → Source 選「GitHub Actions」
# （勿再用「Deploy from a branch」的 / (root)，否則會發到開發用 index.html。）
#
# 仍可手動執行：Actions → Deploy GitHub Pages → Run workflow
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
