# 將 Vite 輸出（docs/）發佈到 GitHub Pages。
#
# 一次性設定（Repository → Settings → Pages）：
#   Build and deployment → Source：選「GitHub Actions」（勿同時用 branch /docs，擇一即可）
#
# 網址：https://kevin7261.github.io/KDrawer/
# Client ID：建置時讀取 repo 內的 .env.production（勿在 workflow 內寫空字串 env，否則會蓋掉檔案）
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
